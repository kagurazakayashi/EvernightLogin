# login 反向代理样例：Nginx（TLS 终止 + 可选子路径）
#
# 用途：把 https://login.example.com（或 https://example.com/login/）转发到本机
# 127.0.0.1:8080 的 login。本文件是**样例**，域名/证书路径/上游地址都要按实际替换。
#
# 与 login 配置的对应关系：
#   server.public_base_url = "https://login.example.com"
#   server.path_prefix     = ""            # 使用下方“根路径”server 块
#   或 https://login.example.com/login + path_prefix "/login"（子路径块）
#   server.trusted_proxies 必须包含本代理所在主机 IP（同机为 127.0.0.1/32）
#   server.tls_terminating_proxy = true
#   server.listen_addr 保持回环：127.0.0.1:8080
#
# 注意：不要剥离路径前缀。下面 proxy_pass 不带 URI 部分，会保留原始请求路径。

# ---------- 根路径部署 ----------
server {
    listen 443 ssl http2;
    server_name login.example.com;

    # 替换为真实证书与私钥；私钥权限仅 root/服务账号可读。
    ssl_certificate     /etc/nginx/tls/login.example.com-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/login.example.com-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:login_tls:10m;

    # 只在确认全站 HTTPS 后启用 HSTS。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 请求体上限按头像/导入需要设置；不要无限放宽。
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 后端不需要连接复用升级；仅页面使用普通 HTTP/1.1。
        proxy_set_header Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 鉴权与令牌响应不得被代理/浏览器缓存。
        proxy_buffering off;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # 不要代理 /metrics、内部诊断等非公开路径；当前版本未暴露，保持拒绝即可。
    location ~ ^/(metrics|debug) {
        return 404;
    }
}

# ---------- 子路径 /login 部署 ----------
# 对应 server.public_base_url = "https://example.com/login"、path_prefix = "/login"
server {
    listen 443 ssl http2;
    server_name example.com;

    ssl_certificate     /etc/nginx/tls/example.com-fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/example.com-key.pem;

    location /login/ {
        # 不剥离 /login 前缀：后端配置的 path_prefix 是 /login。
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
