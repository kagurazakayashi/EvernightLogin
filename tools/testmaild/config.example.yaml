# testmaild 配置文件示例（仅供本地测试邮件使用，不是产品配置）
#
# 作用：让本地测试 SMTP 服务器可以预置监听参数、资源限制、STARTTLS、模拟邮件
# 账户与输出详细程度，便于你自行测试登录项目的邮件相关功能。
#
# 使用方法（在项目根目录执行，先按需修改 addr 等字段）：
#   go run .\tools\testmaild -config .\tools\testmaild\config.example.yaml
#
# 优先级：命令行参数 > 本配置文件 > 内置默认值。
#   - 本文件中的每个字段都可以省略；省略的字段使用内置默认值（见各段注释）。
#   - 命令行显式给出的参数会覆盖这里的同名配置，例如
#     -addr 127.0.0.1:0 覆盖 listen.addr。
#   - 命令行 -auth user:password 一旦出现，会整体替换 auth.accounts（不做合并）。
#
# 严格解析：未知字段、重复键、类型或时长格式错误会直接报错并给出中文提示，
# 不会静默忽略拼写错误。
#
# 安全提示：本服务器只把邮件保存在内存中，不投递、不中继、不连接任何外部邮件
# 服务；默认只监听回环地址。本文件里的密码都是「测试凭据」，不是任何真实账户
# 密码，不要在任何真实服务中复用。

# 监听相关配置。
listen:
  # 监听地址，格式 host:port。
  #   - "127.0.0.1:0" 表示回环地址 + 操作系统随机分配端口（默认值，推荐）。
  #   - "127.0.0.1:2525" 表示固定端口 2525，便于产品配置里写死端口。
  #   - 空主机名（如 ":2525"）不会被当作回环地址，必须同时开启 allow_non_loopback。
  addr: "127.0.0.1:2525"
  # SMTP 问候语与 EHLO 响应中使用的主机名；只影响协议文本，不做 DNS 解析。
  hostname: "testmail.local"
  # 是否显式允许监听非回环地址（默认 false）。
  # 即使开启，本服务器也只做本地内存捕获，不会向任何地址投递；但开启后同一网络
  # 内的其他人可以连接到这里并看到下面配置的测试凭据，仅在你明确理解风险时开启。
  allow_non_loopback: false

# 资源与协议限制。超过限制时返回标准 SMTP 错误码，而不是无限占用资源。
limits:
  # 单条消息（DATA 内容，含头部）字节上限，允许范围 1～16777216。
  # 超限返回 552；内存占用上限约为 本值 × max_messages。
  max_message_bytes: 262144
  # 单条消息收件人数上限，允许范围 1～1000；超限返回 452。
  max_recipients: 50
  # 最大并发连接数，允许范围 1～1024；超限的新连接直接收到 421 并关闭。
  max_connections: 32
  # 内存中最多保留的消息数，允许范围 1～100000；满了以后新邮件返回 452，
  # 需要重启工具或让测试取出/清空消息才能继续接收。
  max_messages: 500
  # 单次读取超时：连接空闲超过该时长会被关闭，允许范围 50ms～1h。
  read_timeout: "30s"
  # 单连接总时长上限，防止慢速客户端长期占用连接，允许范围 50ms～1h。
  session_timeout: "5m"

# STARTTLS（在明文连接上升级 TLS）配置。
starttls:
  # 是否启用 STARTTLS。
  #   - true 且不提供证书文件：自动生成一次性自签测试证书，客户端需显式信任
  #     或临时跳过证书校验。
  #   - false 且证书文件都为空（默认）：不提供 STARTTLS，AUTH 凭据会明文传输，
  #     因此只建议在回环地址上使用。
  enabled: false
  # 可选：自定义证书与私钥 PEM 文件路径（两个必须同时给出）。
  # 给出证书文件即视为启用 STARTTLS；相对路径按运行工具时的当前目录解析。
  cert_file: ""
  key_file: ""

# 模拟邮件账户配置。
auth:
  # 是否要求客户端先通过 AUTH 认证才能发信（MAIL FROM）；默认 false。
  # 开启后未认证的 MAIL FROM 会收到 530；修改后需要重启工具生效。
  require_auth: false
  # 模拟账户清单（测试专用、非真实凭据）。每个账户需要非空用户名与密码，
  # 用户名不能重复。未配置账户时 AUTH 整个关闭。
  # 密码可以用任意测试字符串；启动信息会回显这里的密码以便你连接测试，
  # 并明确标注「本地测试凭据、仅回环使用」。如不希望密码出现在启动输出，
  # 可改用命令行 -auth user:password（不落盘、不回显），或把本文件放在
  # 不纳入版本控制的位置。
  accounts:
    - username: "tester"
      password: "test-pass"
    - username: "tester2"
      password: "test-pass-2"

# 输出详细程度。
output:
  # 消息输出级别：
  #   - summary：每条邮件只打印一行摘要（默认值，与旧版工具行为一致）。
  #   - detail ：额外打印完整信封（MAIL FROM/RCPT TO）、全部原始头部、解析出的
  #              Subject/Date/Message-ID、TLS 与 AUTH 用户、字节数、以及可选正文。
  #   - debug  ：在 detail 基础上默认开启 SMTP 命令轨迹（等同 trace_smtp: true，
  #              可用命令行 -trace-smtp=false 关闭）。
  level: "detail"
  # 是否打印邮件正文；默认 false（只打印头部摘要）。
  print_body: true
  # 正文最多打印的字节数，0 表示不限制（默认 4096）。
  # 超出时输出会明确提示截断，并按 UTF-8 字符边界截断，不会切坏多字节字符。
  max_body_bytes: 8192
  # 是否打印会话级 SMTP 命令轨迹（连接、客户端命令、服务器应答、STARTTLS、
  # 认证成功、连接关闭），用于排查客户端问题；默认 false。
  # AUTH 的凭据类参数会被自动替换为「凭据已脱敏」，密码不会出现在轨迹里。
  trace_smtp: false
