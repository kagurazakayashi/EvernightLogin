# login 最小配置示例。
#
# 覆盖顺序（后者覆盖前者）：内置默认值 < 本文件 < LOGIN_ 环境变量 < 显式代码选项。
# 所有字段都可以省略以使用默认值；未知字段、重复键、类型错误、null、超范围
# 或非法组合都会让加载失败，不会产生监听或数据库副作用。
server:
  # 默认仅监听本机回环地址；对外部署时改成 0.0.0.0:8443 并配置 https 公开地址。
  listen_addr: "127.0.0.1:8080"
  # 额外监听地址（可选）：与 listen_addr 一起组成监听集合，全部绑定成功才提供服务。
  # extra_listen_addrs:
  #   - "[::1]:8081"
  # 固定路径前缀（可选）：独立服务的路由都挂在该前缀下，公开地址路径必须一致。
  path_prefix: ""
  # 外部访问地址；留空表示尚未配置。使用 http 公开地址时只能监听回环地址。
  public_base_url: ""
  # 允许的 HTTP Host（可选）；留空且未配置公开地址时只接受本机回环主机名。
  # allowed_hosts:
  #   - "login.example.com"
  # 可信反向代理 IP/CIDR（可选）：只有这些直连来源的 Forwarded/X-Forwarded-* 生效。
  # trusted_proxies:
  #   - "10.0.0.0/8"
  # 显式确认明文监听只部署在受信任 TLS 终止反向代理后端；启用后必须配置
  # trusted_proxies 与 https public_base_url，才允许非回环明文监听。
  # 与下面的本地 TLS 证书配置互斥。
  tls_terminating_proxy: false
  # 本地 HTTPS 单向认证（可选）：PEM 证书链 + 私钥一一对应，私钥文件必须受限权限；
  # 也可改用 tls_pfx_file + secrets.tls_pfx_password。
  # tls_cert_files:
  #   - "C:/secure/login/server-fullchain.crt"
  # tls_key_files:
  #   - "C:/secure/login/server.key"
  # tls_ca_file: "C:/secure/login/ca-chain.crt"
  # tls_pfx_file: "C:/secure/login/server.pfx"
  # 到期告警窗口（天），默认 30；只影响状态报告，不发送通知。
  tls_expiry_warning_days: 30
  # 可选的客户端证书双向认证（mTLS），默认 disabled。启用后必须同时配置本地 TLS
  # 证书、独立的客户端信任 CA 与显式身份映射；客户端信任 CA 与服务器证书链分开。
  # required 要求所有连接出示有效且已映射的客户端证书；optional 允许匿名连接，
  # 但出示无效证书不会降级。信任更新和撤销需要重启，不提供 OCSP/CRL。
  # tls_client_auth: "required"
  # tls_client_ca_files:
  #   - "C:/secure/login/client-ca.pem"
  # tls_client_identities:
  #   - dns_name: "backup.internal"
  #     service: "backup-agent"
  shutdown_timeout_seconds: 10
logging:
  level: info
  format: text
database:
  # 当前版本只接受 sqlite；其他数据库适配在后续步骤增加。
  driver: sqlite
  path: "database/login.db"
  # 显式 false 会保留，不会被默认值覆盖。
  wal: true
  busy_timeout_ms: 5000

# Passkey / WebAuthn 依赖方配置（步骤 42）。默认关闭；启用时必须显式配置 RP ID
# 与至少一个允许来源，非法值会让加载失败。RP ID 是可注册域名（不能带协议/端口/
# 路径，也不能是 IP）；来源只接受 https 或本地开发用的 http://localhost，且主机
# 必须是 RP ID 或其子域。Passkey 不跨 RP ID 通用，多域名监听不代表可跨任意域名。
# passkey:
#   enabled: true
#   rp_id: "login.example.com"
#   rp_display_name: "示例登录"
#   allowed_origins:
#     - "https://login.example.com"
#     # 子域也可以（RP ID 仍是 login.example.com 时不能用 example.com 以外的站点）：
#     # - "https://auth.login.example.com"
#   user_verification: "required"

# 已登录 APP 扫码确认网页登录（步骤 58）。默认关闭；启用时必须显式配置允许的
# 应用白名单（应用 ID = OAuth client_id），未列入的应用一律拒绝。
# app_qr_login:
#   enabled: true
#   allowed_client_ids:
#     - "app_00000000000000000000000000000001"
#   request_ttl_seconds: 120
#   claim_interval_seconds: 1

# 秘密不能直接写在本文件里，只能引用受保护来源。取消注释后可直接使用：
# secrets:
#   master_key:
#     # 非 Windows 平台要求该文件仅所有者可读写。
#     file: "P:/secure/login/master.key"
# 也可以使用已受保护的环境变量（示例）：
# secrets:
#   master_key:
#     env: LOGIN_MASTER_KEY
# PFX/P12 密码同样只能来自受保护来源（与 master_key 互不影响）：
# secrets:
#   tls_pfx_password:
#     env: LOGIN_TLS_PFX_PASSWORD
